name: Build Roblox Floating Window APK
on:
  push:
    paths:
      - 'floating-game-window-pro/**'
      - '.github/workflows/floating-game-window.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        working-directory: floating-game-window-pro
        run: gradle --no-daemon assembleDebug
      - name: Prepare direct APK
        run: cp floating-game-window-pro/app/build/outputs/apk/debug/app-debug.apk FloatingGameWindowPro.apk
      - name: Verify APK
        run: test -s FloatingGameWindowPro.apk
      - name: Publish direct APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: floating-game-window-latest
          name: Roblox Floating Window (latest build)
          body: "APK experimental: requests Android/Samsung native freeform window for Roblox. Device support is required; launch bounds may be ignored."
          files: FloatingGameWindowPro.apk
          overwrite_files: true
          make_latest: true
