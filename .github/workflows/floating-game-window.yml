name: Build Floating Game Window Pro
on:
  push:
    paths:
      - 'floating-game-window-pro/**'
      - '.github/workflows/floating-game-window.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        working-directory: floating-game-window-pro
        run: gradle --no-daemon assembleDebug
      - name: Verify APK
        run: test -s floating-game-window-pro/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FloatingGameWindow
          path: floating-game-window-pro/app/build/outputs/apk/debug/app-debug.apk
