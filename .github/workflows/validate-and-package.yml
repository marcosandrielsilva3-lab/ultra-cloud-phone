name: Build Ultra Cloud Play test APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate server shell scripts
        run: |
          bash -n install.sh
          bash -n start.sh
          bash -n stop.sh
          bash -n status.sh

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Prepare and verify APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/UltraCloudPlay.apk
          test -s release/UltraCloudPlay.apk
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -x "$AAPT"
          "$AAPT" dump badging release/UltraCloudPlay.apk | grep -F "package: name='com.ultracloud.phone' versionCode='4' versionName='0.3.0'"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UltraCloudPlay-APK
          path: release/UltraCloudPlay.apk
          retention-days: 30

      - name: Publish APK-only GitHub Release
        if: github.event_name == 'push' && contains(github.event.head_commit.message, 'Publish APK download')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.${{ github.run_number }}
          name: Ultra Cloud Play v0.3.${{ github.run_number }}
          body: |
            Download único: UltraCloudPlay.apk.
            Iniciador de teste para Roblox na nuvem via EasyFun.
            O jogo é executado nos servidores de terceiros da EasyFun.
            Limite informado pela EasyFun: até 6 horas por dia com login; pode mudar.
            Este APK não fornece servidor próprio nem tempo ilimitado.
          files: |
            release/UltraCloudPlay.apk
          make_latest: true
