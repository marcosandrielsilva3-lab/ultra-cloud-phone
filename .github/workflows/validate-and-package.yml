name: Validate and package installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate shell scripts
        run: |
          bash -n install.sh
          bash -n start.sh
          bash -n stop.sh
          bash -n status.sh

      - name: Check that service ports are private
        run: |
          grep -F -- '--publish 127.0.0.1:5555:5555' install.sh
          grep -F -- '--publish "$TAIL_IP:5800:5800"' install.sh
          grep -F -- '--publish "$TAIL_IP:5900:5900"' install.sh
          ! grep -E -- '--publish[[:space:]]+5555:5555' install.sh

      - name: Create clean one-level installer ZIP
        run: |
          zip -j ultra-cloud-phone-installer.zip README.md install.sh start.sh stop.sh status.sh LICENSE

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ultra-cloud-phone-installer
          path: ultra-cloud-phone-installer.zip
          retention-days: 30

      - name: Publish downloadable GitHub Release
        if: github.event_name == 'push' && contains(github.event.head_commit.message, 'Publish GitHub download')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: installer-${{ github.run_number }}
          name: Ultra Cloud Phone installer ${{ github.run_number }}
          files: ultra-cloud-phone-installer.zip
          make_latest: true
