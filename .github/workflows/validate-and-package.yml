name: Build Ultra Cloud Phone APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate server shell scripts
        run: |
          bash -n install.sh
          bash -n start.sh
          bash -n stop.sh
          bash -n status.sh

      - name: Check private service port bindings
        run: |
          grep -F -- '--publish 127.0.0.1:5555:5555' install.sh
          grep -F -- '--publish "$TAIL_IP:5800:5800"' install.sh
          grep -F -- '--publish "$TAIL_IP:5900:5900"' install.sh
          ! grep -E -- '--publish[[:space:]]+5555:5555' install.sh

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Prepare and verify APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/UltraCloudPhone.apk
          test -s release/UltraCloudPhone.apk
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -x "$AAPT"
          "$AAPT" dump badging release/UltraCloudPhone.apk | grep -F "package: name='com.ultracloud.phone' versionCode='2' versionName='0.2.0'"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UltraCloudPhone-APK
          path: release/UltraCloudPhone.apk
          retention-days: 30

      - name: Publish APK-only GitHub Release
        if: github.event_name == 'push' && contains(github.event.head_commit.message, 'Publish APK download')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.${{ github.run_number }}
          name: Ultra Cloud Phone v0.2.${{ github.run_number }}
          body: |
            Download único: UltraCloudPhone.apk.
            Este é o aplicativo Android instalável.
            O app cliente ainda precisa de um servidor Android remoto configurado para conectar.
          files: |
            release/UltraCloudPhone.apk
          make_latest: true
