plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ultracloud.phone'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ultracloud.phone'
        minSdk 23
        targetSdk 28
        versionCode 3
        versionName '0.2.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
